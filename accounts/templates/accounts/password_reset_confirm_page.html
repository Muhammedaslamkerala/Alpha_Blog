{% extends "accounts/password_base.html" %}

{% block title %}Set New Password - Alpha{% endblock %}

{% block content %}
<h2>Set New Password</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
    </div>
    {% endfor %}
    <button type="submit">Set New Password</button>
</form>
{% endblock %}
