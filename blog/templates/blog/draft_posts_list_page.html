
{% for  post in posts %}
  <article class="post">
    <header class="post-header">
      <h2 class="post-title">{{ post.title }}</h2>
      <div class="post-options">
        <div class="dropdown">
          <button
            class="btn btn-link"
            type="button"
            id="postOptionsDropdown3"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="fas fa-ellipsis-v"></i>
          </button>
          <ul
            class="dropdown-menu dropdown-menu-end"
            aria-labelledby="postOptionsDropdown3"
          >
            <li>
              <a class="dropdown-item" href="{% url 'blog:post_edit' post.slug %}"
                ><i class="fas fa-edit me-2"></i>Edit</a
              >
            </li>
            <li>
              <a href="{% url 'blog:post-delete' post.slug %}">
              <i class="fas fa-trash-alt me-2"></i>Delete</a>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </header>
    <div class="post-content">
      <p class="post-excerpt">
       {{ post.short_description }}
      </p>
      <a href="{% url 'blog:post_edit' post.slug %}" class="btn btn-primary btn-sm btn-edit">Continue Editing</a>
    </div>
  </article>
  {% endfor %}
