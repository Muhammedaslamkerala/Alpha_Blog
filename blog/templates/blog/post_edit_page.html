{% extends "base.html" %}

{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static "blog/css/post_edit_page_style.css" %}">
{% endblock  %}

{% block navbar %}{% endblock  %}
{% block content %}
    <div class="container">
        <h1>Edit Blog Post</h1>
        <form method='post' id="editBlogForm">
            {{ form.media }}
            {% csrf_token %}
            {{ form.as_p}}

            <div class="button-group">
                <button type="submit">Update Post</button>
                <button type="button" id="deleteButton" class="delete-button">Delete Post</button>
            </div>
        </form>
    </div>

{% endblock  %}

{% block footer %}{% endblock  %}
