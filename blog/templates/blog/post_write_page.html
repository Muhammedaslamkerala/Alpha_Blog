
    {% extends "base.html" %}
    
    {% load static %}

    {% block extra_head %}
    <link rel="stylesheet" href="{% static "blog/css/post_write_page_style.css" %}">
    {% endblock  %}

 {% block navbar %}{% endblock  %}

    {% block content %}
    <div  class="container">
        <h1>Create a New Blog Post</h1>
        <form id="blogForm" method="post"  enctype="multipart/form-data" novalidate>
            {{ form.media }}
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Submit Post</button>
        </form>

        <button id="aiAssistBtn" class="btn btn-secondary mt-3">
            <i class="fas fa-robot"></i> AI-Assisted Writing
        </button>
    </div>
    {% endblock  %}
   {% block footer %}{% endblock  %}
