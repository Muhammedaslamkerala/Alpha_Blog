<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Post Confirmation</title>
    {% load static %}
    <link rel="stylesheet" href="{% static "blog/css/delete_post_confirmation_page.css" %}">
</head>
<body>
    <div class="confirmation-container">
        <h2>Are you sure you want to delete "{{ object.title }}"?</h2>
        <p>This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
        <input type="submit" value="Confirm">
        </form>
        <a href="{% url 'blog:post_details' object.slug %}">Cancel</a>
    </div>
</body>
</html>
